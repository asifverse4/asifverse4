<svg width="1280" height="260" viewBox="0 0 1280 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Computational chemistry research loop</title>
  <desc id="desc">Animated loop from hypothesis to conformer search, DFT, spectroscopy, and reproducible reporting.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 12; }
      .label { fill: #e2e8f0; font: 600 16px 'Segoe UI', Arial, sans-serif; }
      .sub { fill: #94a3b8; font: 13px 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="260" fill="#090b15" rx="18"/>

  <g>
    <rect class="box" x="50" y="76" width="210" height="96"/>
    <text class="label" x="72" y="115">Hypothesis</text>
    <text class="sub" x="72" y="140">target molecule/system</text>

    <rect class="box" x="300" y="76" width="210" height="96"/>
    <text class="label" x="322" y="115">xTB / CREST</text>
    <text class="sub" x="322" y="140">conformer search</text>

    <rect class="box" x="550" y="76" width="210" height="96"/>
    <text class="label" x="572" y="115">ORCA / DFT</text>
    <text class="sub" x="572" y="140">electronic structure</text>

    <rect class="box" x="800" y="76" width="210" height="96"/>
    <text class="label" x="822" y="115">Spectroscopy</text>
    <text class="sub" x="822" y="140">analysis + interpretation</text>

    <rect class="box" x="1050" y="76" width="180" height="96"/>
    <text class="label" x="1072" y="115">Reporting</text>
    <text class="sub" x="1072" y="140">reproducible outputs</text>
  </g>

  <g fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 124 H300 M510 124 H550 M760 124 H800 M1010 124 H1050"/>
    <path d="M1230 124 C1238 180 1205 220 640 220 C220 220 70 205 60 160" opacity="0.75"/>
  </g>

  <circle cx="60" cy="160" r="4" fill="#22d3ee">
    <animateMotion dur="8s" repeatCount="indefinite" path="M0 0 C8 -36 55 -36 200 -36 H1190 C1198 20 1165 60 600 60 C180 60 30 45 20 0"/>
  </circle>
</svg>
