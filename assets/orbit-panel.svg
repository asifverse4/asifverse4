<svg width="520" height="320" viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orbital status panel</title>
  <desc id="desc">Decorative animated panel with orbiting atoms and terminal-like status rows.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="504" height="304" rx="16" fill="url(#panel)" stroke="#334155"/>

  <g transform="translate(130 160)">
    <circle r="10" fill="#e2e8f0"/>
    <ellipse rx="88" ry="36" fill="none" stroke="#22d3ee" stroke-opacity="0.7"/>
    <ellipse rx="88" ry="36" fill="none" stroke="#8b5cf6" stroke-opacity="0.7" transform="rotate(60)"/>
    <ellipse rx="88" ry="36" fill="none" stroke="#67e8f9" stroke-opacity="0.6" transform="rotate(120)"/>
    <circle cx="88" cy="0" r="5" fill="#22d3ee">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-88" cy="0" r="4" fill="#a78bfa">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <text x="245" y="62" fill="#e2e8f0">terminal://research-status</text>
    <text x="245" y="102" fill="#22d3ee">[ok] conformer ensemble generated</text>
    <text x="245" y="130" fill="#a78bfa">[run] DFT refinement queue active</text>
    <text x="245" y="158" fill="#67e8f9">[ok] spectral comparison updated</text>
    <text x="245" y="186" fill="#94a3b8">[git] workflow + report synced</text>
    <rect x="245" y="210" width="170" height="10" rx="5" fill="#1f2937"/>
    <rect x="245" y="210" width="112" height="10" rx="5" fill="#22d3ee">
      <animate attributeName="width" values="90;140;112" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
